name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black pytest

      - name: Run Flake8
        run: flake8 --config .flake8 .

      - name: Check formatting with Black
        run: black --check .

      - name: Run tests
        run: python -m pytest -q

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-quiz:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ci-cd-quiz:${{ github.sha }}   

  deploy-dev:
    needs: docker-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    runs-on: [self-hosted, ci-cd-quiz]

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull Docker image
        run: |
          docker pull docker.io/${DOCKERHUB_USERNAME}/ci-cd-quiz:${IMAGE_TAG}

      - name: Create .env.dev
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN_DEV }}
          FEEDBACK_CHANNEL_ID: ${{ secrets.FEEDBACK_CHANNEL_ID }}
        run: |
          test -n "$BOT_TOKEN"
          test -n "$FEEDBACK_CHANNEL_ID"

          cat > /srv/projects/ci_cd_quiz_bot/.env.dev <<EOF
          ENV=dev
          BOT_TOKEN=$BOT_TOKEN
          FEEDBACK_CHANNEL_ID=$FEEDBACK_CHANNEL_ID
          LOG_LEVEL=INFO
          EOF

      - name: Deploy dev
        working-directory: /srv/projects/ci_cd_quiz_bot/app
        run: |
          docker compose \
            -f docker-compose.dev.yml \
            --env-file .env.dev \
            -p ci-cd-quiz-dev \
            up -d --force-recreate

      - name: Show running container
        run: |
          docker ps \
            --filter "name=ci-cd-quiz-dev" \
            --format "{{.Names}} {{.Image}} {{.Status}}"