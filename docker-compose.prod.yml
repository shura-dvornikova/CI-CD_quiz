services:
  bot:
    image: docker.io/${DOCKERHUB_USERNAME}/ci-cd-quiz:${IMAGE_TAG}
    container_name: ci-cd-quiz-prod
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DB_PATH: /data/quiz_bot.db
    volumes:
      - ci-cd-quiz-prod-data:/data

volumes:
  ci-cd-quiz-prod-data: